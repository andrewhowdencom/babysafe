# https://taskfile.dev

version: "3"

vars:
  BINARY: babysafe
  CMD_DIR: ./cmd/babysafe
  MAIN_PKG: ./cmd/babysafe
  VERSION_PKG: github.com/andrewhowdencom/babysafe/internal/version

env:
  CGO_ENABLED: "0"

tasks:
  default:
    cmds:
      - task: --help
    silent: true

  setup:
    desc: Install required development tools.
    cmds:
      - go install github.com/google/wire/cmd/wire@latest
      - go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
      - go install github.com/cweill/gotests/...@latest
      - go install golang.org/x/tools/cmd/godoc@latest

  generate:
    desc: Generate code (mocks, wire providers).
    cmds:
      - go generate ./...
      - go mod tidy

  build:
    desc: Build the application binary.
    cmds:
      - go build -trimpath -ldflags="-s -w -X '{{.VERSION_PKG}}.Version={{.VERSION}}'" -o bin/{{.BINARY}} {{.CMD_DIR}}

  build:linux:
    desc: Build for the only supported target (Linux).
    env:
      GOOS: linux
      GOARCH: amd64
    cmds:
      - task: build

  test:
    desc: Run unit tests with the race detector.
    env:
      CGO_ENABLED: "1"
    cmds:
      - go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - go tool cover -func=coverage.out

  lint:
    desc: Run the linter.
    cmds:
      - golangci-lint run --timeout=5m ./...

  validate:
    desc: Run the full validation suite (format, vet, lint, test, build).
    cmds:
      - gofmt -l .
      - go vet ./...
      - task: lint
      - task: test
      - task: build

  clean:
    desc: Remove build artifacts.
    cmds:
      - rm -rf bin/ coverage.out
      - go clean -cache -testcache

  run:
    desc: Run the application locally.
    cmds:
      - go run {{.MAIN_PKG}} {{.CLI_ARGS}}