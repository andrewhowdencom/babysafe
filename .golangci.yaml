# golangci-lint v1 configuration.
# Schema reference: https://golangci-lint.run/usage/configuration/

linters:
  disable-all: true
  enable:
    - errcheck       # Unchecked errors
    - govet          # Suspicious constructs
    - ineffassign    # Unused assignments
    - staticcheck    # Static analysis
    - unused         # Unused identifiers
    - gosec          # Security
    - gocritic       # Opinionated style / perf
    - misspell       # Typos
    - bodyclose      # HTTP body close
    - contextcheck   # ctx propagation
    - nilerr         # Returning nil after handling err
    - nolintlint     # nolint correctness

  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance

run:
  timeout: 5m
  tests: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0